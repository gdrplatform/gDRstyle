name: CI

on:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  workflow_call:
    inputs:
      USERNAME:
        required: true
        type: string
      PACKAGE_NAME:
        required: true
        type: string
      BRANCH_NAME:
        required: true
        type: string
      COMMIT_HASH:
        required: true
        type: string
      COMMIT_MSG:
        required: true
        type: string
    secrets:
      PRIVATE_ACCESS_TOKEN:
        required: true
      GDRGENESIS_TRIGGER_TOKEN:
        required: true
      GDRVIZ_TRIGGER_TOKEN:
        required: true

jobs:
  contribution_lint:
    if: github.event.pull_request.merged == false
    uses: ./.github/workflows/conventional-commit-check.yml

  check_membership:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged == false
    outputs:
      is_team_member: ${{ steps.check.outputs.isTeamMember }}
    steps:
      - uses: tspascoal/get-user-teams-membership@v1
        id: check
        with:
          username: ${{ github.actor }}
          team: 'PR reviewers'
          GITHUB_TOKEN: ${{ secrets.PRIVATE_ACCESS_TOKEN }}

  external_check:
    needs: check_membership
    if: needs.check_membership.outputs.is_team_member == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::gDRstyle

      - name: Run checks
        run: gDRstyle::checkPackage("${{ github.event.repository.name }}", ".")
        shell: Rscript {0}

      - name: Post test-result status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATE="success"
            DESC="External checks passed"
          else
            STATE="failure"
            DESC="External checks failed"
          fi
          curl -s -X POST \
            -u "x-access-token:${{ secrets.PRIVATE_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"test-result\",\"description\":\"$DESC\"}"

  internal_trigger:
    needs: check_membership
    if: needs.check_membership.outputs.is_team_member == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger GitLab pipeline
        id: trigger
        run: |
          # Fail loudly when no pipeline is created. Without this the job stays green,
          # the pending status below is posted with an empty target_url, and nothing ever
          # overwrites it — the PR then shows every check green plus one check pending
          # forever. A dead trigger token hid a three-day CI outage that way.
          HTTP_CODE=$(curl -s -o trigger_response.json -w "%{http_code}" -X POST \
            -F token=${{ secrets.GDRGENESIS_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[PACKAGE_NAME]=${{ github.event.repository.name }}" \
            -F "variables[BRANCH_NAME]=${{ github.head_ref }}" \
            "https://code.roche.com/api/v4/projects/167859/trigger/pipeline")
          PIPELINE_URL=$(jq -r '.web_url // empty' trigger_response.json)
          rm -f trigger_response.json
          if [ "$HTTP_CODE" != "201" ] || [ -z "$PIPELINE_URL" ]; then
            echo "::error::No gdrgenesis pipeline was created (HTTP $HTTP_CODE)."
            echo "::error::The trigger token is most likely invalid, revoked, or owned by a disabled account."
            echo "::error::Rotate GDRGENESIS_TRIGGER_TOKEN — see the CI/CD token maintenance procedure."
            exit 1
          fi
          echo "pipeline_url=$PIPELINE_URL" >> "$GITHUB_OUTPUT"

      - name: Post pending test-result status
        run: |
          curl -s -X POST \
            -u "x-access-token:${{ secrets.PRIVATE_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "{\"state\":\"pending\",\"context\":\"test-result\",\"description\":\"GitLab pipeline running\",\"target_url\":\"${{ steps.trigger.outputs.pipeline_url }}\"}"

      - name: Report trigger failure as test-result
        if: failure()
        run: |
          # Make the outage visible on the pull request itself, not only in the Actions log.
          curl -s -X POST \
            -u "x-access-token:${{ secrets.PRIVATE_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"test-result\",\"description\":\"Could not start the GitLab pipeline — check the trigger token\",\"target_url\":\"\"}"

  deploy-dev:
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger deploy pipeline
        run: |
          # Same guard as internal_trigger: a silently skipped deploy is worse than a red job.
          HTTP_CODE=$(curl -s -o deploy_response.json -w "%{http_code}" -X POST \
            -F token=${{ secrets.GDRVIZ_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[SOURCE_BRANCH]=${{ github.head_ref }}" \
            -F "variables[COMMIT_HASH]=${{ github.sha }}" \
            -F "variables[COMMIT_MSG]=${{ github.event.head_commit.message }}" \
            -F "variables[TESTS_RESULT]=SUCCESSFUL" \
            "https://code.roche.com/api/v4/projects/181632/trigger/pipeline")
          PIPELINE_URL=$(jq -r '.web_url // empty' deploy_response.json)
          rm -f deploy_response.json
          if [ "$HTTP_CODE" != "201" ] || [ -z "$PIPELINE_URL" ]; then
            echo "::error::No deploy pipeline was created (HTTP $HTTP_CODE)."
            echo "::error::The trigger token is most likely invalid, revoked, or owned by a disabled account."
            echo "::error::Rotate GDRVIZ_TRIGGER_TOKEN — see the CI/CD token maintenance procedure."
            exit 1
          fi
          echo "Deploy pipeline: $PIPELINE_URL"
