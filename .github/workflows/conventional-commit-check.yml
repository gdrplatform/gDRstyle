name: conventional-commit-check

on:
  workflow_call:

jobs:
  check-pr-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|refactor|docs|test|chore|ci|perf|build|revert)(\([^)]+\))?: .+'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title follows Conventional Commits: '$PR_TITLE'"
          else
            echo "::warning::PR title '$PR_TITLE' does not follow Conventional Commits format."
            echo "::warning::Expected: <type>: <description>  (e.g. 'feat: add new linter')"
            echo "::warning::Valid types: feat, fix, refactor, docs, test, chore, ci, perf, build, revert"
            echo "::warning::See the style guide vignette for details. This check is informational only."
          fi
          exit 0

  contribution-lint:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.number != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::gDRstyle

      - name: Run contribution linters
        shell: Rscript {0}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range <- paste0(Sys.getenv("BASE_SHA"), "..", Sys.getenv("HEAD_SHA"))
          hashes <- system2("git", c("log", "--format=%H", range), stdout = TRUE)
          messages <- vapply(hashes, function(h) {
            paste(system2("git", c("show", "-s", "--format=%B", h),
                          stdout = TRUE), collapse = "\n")
          }, character(1), USE.NAMES = FALSE)
          gDRstyle::lintCommitMessages(messages)
          gDRstyle::lintPrTitle(Sys.getenv("PR_TITLE"))
          gDRstyle::checkPrTemplate(Sys.getenv("PR_BODY"),
                                    ".github/PULL_REQUEST_TEMPLATE.md")
