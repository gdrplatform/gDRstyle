name: conventional-commit-check

on:
  workflow_call:

jobs:
  check-pr-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|refactor|docs|style|test|chore|ci|perf|build|revert)(\([^)]+\))?: .+'
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title follows Conventional Commits: '$PR_TITLE'"
          else
            echo "::warning::PR title '$PR_TITLE' does not follow Conventional Commits format."
            echo "::warning::Expected: <type>: <description>  (e.g. 'feat: add new linter')"
            echo "::warning::Valid types: feat, fix, refactor, docs, style, test, chore, ci, perf, build, revert"
            echo "::warning::See the style guide vignette for details. This check is informational only."
          fi
          exit 0

  contribution-lint:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.number != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install gDRstyle
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          install.packages("pak", repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.version$os, R.version$arch))
          # the released series lacks the devel contribution linters, so install
          # this repo's own source (self) or the devel head (consumer repos)
          spec <- if (Sys.getenv("GITHUB_REPOSITORY") == "gdrplatform/gDRstyle") {
            "local::."
          } else {
            "gdrplatform/gDRstyle@main"
          }
          pak::pak(spec)

      - name: Run contribution linters
        shell: Rscript {0}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base <- paste0("origin/", Sys.getenv("BASE_REF"))
          hashes <- system2("git", c("log", "--no-merges", "--format=%H",
                                     paste0(base, "..", Sys.getenv("HEAD_SHA"))),
                            stdout = TRUE)
          stopifnot(is.null(attr(hashes, "status")))
          messages <- vapply(hashes, function(h) {
            paste(system2("git", c("show", "-s", "--format=%B", h),
                          stdout = TRUE), collapse = "\n")
          }, character(1), USE.NAMES = FALSE)
          gDRstyle::lintCommitMessages(messages)
          gDRstyle::lintMergeRequest(
            title = Sys.getenv("PR_TITLE"),
            body = Sys.getenv("PR_BODY"),
            pkg_dir = "."
          )
